 if(k=='rock'){x.fillStyle='#4b3f33';x.beginPath();x.moveTo(sx,bot);x.lineTo(sx,q.y+8);for(var j=0;j<=q.w;j+=40)x.lineTo(sx+j,q.y+(j%80?4:0));x.lineTo(sx+q.w,bot);x.fill();x.fillStyle='#6a5a49';x.fillRect(sx,q.y,q.w,6);x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=2;for(var j=20;j<bot-q.y;j+=34){x.beginPath();x.moveTo(sx,q.y+j);x.lineTo(sx+q.w,q.y+j+6);x.stroke()}return}
 if(q.mv||(k=='move')){x.fillStyle='#f2b705';x.fillRect(sx,q.y,q.w,34);x.fillStyle='#111';x.fillRect(sx,q.y+15,q.w,6);x.fillStyle='#3a5a8a';for(var j=14;j<q.w-26;j+=34)x.fillRect(sx+j,q.y+22,22,9);x.fillStyle='#111';x.beginPath();x.arc(sx+34,q.y+36,9,0,6.3);x.arc(sx+q.w-34,q.y+36,9,0,6.3);x.fill();if(!q.mv){x.fillStyle='#17122b';x.fillRect(sx,q.y+44,q.w,bot-q.y)}return}
 x.fillStyle='#17122b';x.fillRect(sx,q.y,q.w,bot-q.y);x.fillStyle='#3a3262';x.fillRect(sx,q.y,q.w,5);x.fillStyle='#241c42';x.fillRect(sx,q.y+5,q.w,7);
 x.fillStyle='rgba(255,214,120,.5)';for(var j=20;j<q.w-20;j+=34)for(var m=q.y+26;m<bot;m+=30)if(((j+m+Math.floor(q.x))%5)<2)x.fillRect(sx+j,m,9,13);
 var d=Math.floor(q.x)%97;x.fillStyle='#2c2450';if(d%2)x.fillRect(sx+q.w-70,q.y-14,24,14);else{x.fillRect(sx+q.w-60,q.y-30,3,30);x.fillRect(sx+q.w-66,q.y-24,15,2)}}
function drawObs(o){var sx=o.x-cam;if(sx>Wd+20||sx<-90)return;var t2=o.t;
 if(t2=='crate'){x.fillStyle='#7a5230';x.fillRect(sx,o.top,o.w,36);x.strokeStyle='#4a2f18';x.lineWidth=2;x.strokeRect(sx+1,o.top+1,o.w-2,34);x.beginPath();x.moveTo(sx,o.top);x.lineTo(sx+o.w,o.bot);x.moveTo(sx+o.w,o.top);x.lineTo(sx,o.bot);x.stroke()}
 else if(t2=='sign'){x.strokeStyle='#5b5470';x.lineWidth=2;x.beginPath();x.moveTo(sx+6,o.top);x.lineTo(sx+6,o.top-140);x.moveTo(sx+o.w-6,o.top);x.lineTo(sx+o.w-6,o.top-140);x.stroke();x.fillStyle='#c0261e';x.fillRect(sx,o.top,o.w,34);x.fillStyle='#f4efe6';for(var i=6;i<o.w-8;i+=14)x.fillRect(sx+i,o.top+6,7,22)}
 else if(t2=='car'){x.fillStyle=o.col;x.fillRect(sx,o.top+8,o.w,24);x.fillRect(sx+12,o.top,o.w-26,12);x.fillStyle='#cfe9f7';x.fillRect(sx+16,o.top+2,o.w-34,8);x.fillStyle='#111';x.beginPath();x.arc(sx+14,o.bot,7,0,6.3);x.arc(sx+o.w-14,o.bot,7,0,6.3);x.fill()}
 else if(t2=='dog'){var lg=Math.sin(t*.5)*5;x.fillStyle='#3a2a20';x.fillRect(sx+4,o.top+4,24,12);x.beginPath();x.arc(sx+4,o.top+6,7,0,6.3);x.fill();x.fillRect(sx+6,o.top+14,3,8+lg);x.fillRect(sx+22,o.top+14,3,8-lg);x.fillStyle='#c0261e';x.fillRect(sx+1,o.top+2,3,2)}
 else if(t2=='laser'){var on=laserOn(o),warn=((t+o.ph)%150)>=70&&!on;x.fillStyle='#444';x.fillRect(sx,o.bot-6,o.w,6);x.fillRect(sx,o.top,o.w,6);if(on){x.fillStyle='rgba(255,60,60,.35)';x.fillRect(sx-4,o.top,o.w+8,o.bot-o.top);x.fillStyle='#ff4040';x.fillRect(sx+2,o.top+6,o.w-4,o.bot-o.top-12)}else if(warn&&(t>>2)%2){x.fillStyle='rgba(255,200,80,.6)';x.fillRect(sx+3,o.top+6,2,o.bot-o.top-12)}else{x.fillStyle='rgba(255,60,60,.12)';x.fillRect(sx+3,o.top+6,2,o.bot-o.top-12)}}
 else if(t2=='rock'){if(o.st==1){x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(sx+15,o.y,16,4,0,0,6.3);x.fill()}var ry=o.st?o.ry:o.y-15;if(o.st==0&&sx>Wd)return;if(o.st==0)return;x.fillStyle='#7d7568';x.beginPath();x.arc(sx+15,ry,15,0,6.3);x.fill();x.strokeStyle='#4b453c';x.lineWidth=2;x.beginPath();x.moveTo(sx+8,ry-6);x.lineTo(sx+16,ry+2);x.lineTo(sx+12,ry+9);x.stroke()}}
function hud(){x.setTransform(DPR,0,0,DPR,0,0);var tp=SAT+10,u=Math.max(12,Math.min(15,CW/26)),pw=Math.min(CW-20,360);
 x.fillStyle='rgba(10,7,20,.6)';x.fillRect(10,tp,pw,46);x.fillStyle='#f2b705';x.font='bold '+u+'px system-ui,sans-serif';x.fillText('CH '+C.num+' · '+C.n.toUpperCase(),18,tp+18);
 x.fillStyle='#f4efe6';x.font=(u-2)+'px system-ui,sans-serif';var ob=C.g=='survive'?'Survive '+Math.max(0,Math.ceil(C.lim-time/60))+'s':C.g=='timed'?'Reach '+C.exit+' · '+Math.max(0,Math.ceil(C.lim-time/60))+'s left':C.g=='coins'?(C.cg==1?'Chips ':'Coins ')+coins+'/'+C.need+' then reach '+C.exit:'Reach '+C.exit;x.fillText(ob,18,tp+36);
 var pr=C.g=='survive'?time/60/C.lim:dist/C.len;x.fillStyle='rgba(255,255,255,.25)';x.fillRect(10,tp+50,pw,6);x.fillStyle='#1e7f5c';x.fillRect(10,tp+50,pw*Math.min(1,pr),6);
 x.fillStyle='rgba(10,7,20,.6)';x.fillRect(CW-150,tp,140,46);x.fillStyle='#ffd34d';x.font='bold '+u+'px system-ui,sans-serif';x.fillText(f(coins*1000),CW-142,tp+19);
 x.fillStyle=lead<30&&(t>>3)%2?'#fff':'#c0261e';x.fillRect(CW-142,tp+28,124*Math.max(0,lead)/100,8);x.fillStyle='#f4efe6';x.font='9px system-ui,sans-serif';x.fillText(C.chase.length>16?'CHASERS':C.chase,CW-142,tp+44);
 if(bt>0&&bn){x.globalAlpha=Math.min(1,bt/20);x.font='bold '+(u+1)+'px system-ui,sans-serif';var w=Math.min(CW-24,x.measureText(bn).width+34);x.fillStyle='rgba(10,7,20,.82)';x.fillRect(CW/2-w/2,tp+76,w,34);x.fillStyle='#f2b705';x.textAlign='center';x.fillText(bn.length*u*.55>CW-40?bn.slice(0,Math.floor((CW-60)/(u*.55)))+'…':bn,CW/2,tp+98);x.textAlign='left';x.globalAlpha=1}}
function draw(){x.setTransform(DPR*S,0,0,DPR*S,0,oy*S*DPR);var g=x.createLinearGradient(0,-oy,0,360+oy),p=C.pal;g.addColorStop(0,p[0]);g.addColorStop(.6,p[1]);g.addColorStop(1,p[2]);x.fillStyle=g;x.fillRect(0,-oy-4,Wd+4,Hd+8);
 x.fillStyle='rgba(255,226,150,.85)';x.beginPath();x.arc(Math.min(Wd-90,470),200,58,0,6.3);x.fill();
 layer(L2,.15,C.l[0],'rgba(255,200,120,.35)');layer(L1,.35,C.l[1],'rgba(255,214,120,.5)');
 x.save();if(shake>.5)x.translate(rnd(-shake,shake),rnd(-shake,shake));
 for(var i=0;i<plats.length;i++)drawPlat(plats[i]);
 if(C.water){x.fillStyle='rgba(30,100,150,.8)';x.beginPath();x.moveTo(0,330);for(var xx=0;xx<=Wd+20;xx+=20)x.lineTo(xx,330+Math.sin(xx*.05+t*.06)*3);x.lineTo(Wd+20,360+oy+30);x.lineTo(0,360+oy+30);x.fill()}
 for(var i=0;i<obs.length;i++)drawObs(obs[i]);
 for(var i=0;i<cns.length;i++){var c=cns[i];if(c.got)continue;var sx=c.x-cam;if(sx<-20||sx>Wd+20)continue;var cy=c.y+Math.sin(t*.1+c.x)*2;if(C.cg==1){x.fillStyle='#53e0e0';x.fillRect(sx-7,cy-7,14,14);x.fillStyle='#1b1146';x.fillRect(sx-3,cy-3,6,6)}else{x.fillStyle='#ffd34d';x.beginPath();x.arc(sx,cy,7,0,6.3);x.fill();x.strokeStyle='#b98600';x.lineWidth=2;x.stroke()}}
 if(fin){var fx=fin.x-cam,fy=P.gy;x.fillStyle='#1e7f5c';x.fillRect(fx,fy-170,150,170);x.fillStyle='#fff4c2';x.fillRect(fx+55,fy-72,40,72);x.fillStyle='#f4efe6';x.font='bold 12px system-ui';x.fillText(C.exit,fx+14,fy-150)}
 if(st=='run'||st=='dead'){for(var i=0;i<3;i++){var cx=PX-34-lead*2.1-i*38;if(cx>-30)ninja(cx,P.gy,P.ph*.9+i*1.3,'run',.95,'#07060c','#b3261e',false,.95)}}
 ninja(PX,P.y,P.ph,curPose(),1,'#0b0b10','#c0261e',true,inv>0&&(t>>2)%2?.5:1,C.carry);
 for(var i=0;i<parts.length;i++){var p=parts[i];x.fillStyle=p.c;x.globalAlpha=Math.min(1,p.l/14);x.fillRect(p.x-cam,p.y,3,3)}x.globalAlpha=1;
 x.restore();hud()}
function card(h){ov.style.display='flex';ov.innerHTML='<div class="card">'+h+'</div>'}
function btns(v){$('bs').style.display=$('bj').style.display=v?'block':'none'}
function fs(){try{var d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(function(){})}catch(e){}}
function intro(){st='intro';btns(0);C=chapter(chap);reset();var rec=C.rec?'<p class="tag">RECURRENCE</p>':'';
 card('<p class="tag">CHAPTER '+chap+'</p><h1>'+C.n+'</h1>'+rec+'<p>'+C.b+'</p><p class="mut">⬆ JUMP (tap again in the air to double jump)<br>⬇ SLIDE under the red signs<br>Total earned: <b>'+f(bank)+'</b></p><button class="go" id="go">'+(chap>1?'Start chapter '+chap:'Run!')+'</button>'+(chap>1?'<button id="ng">New game from chapter 1</button>':''));
 $('go').onclick=function(){fs();start()};var ng=$('ng');if(ng)ng.onclick=function(){chap=1;bank=0;save();intro()}}
function start(){reset();ov.style.display='none';btns(1);st='run'}
var LL={award:function(n){return Promise.resolve({ok:false,why:'Not connected yet. Waiting for Vatar test keys.'})}};

 card('<p class="tag">CHAPTER '+chap+'</p><h1>'+(win?'Mission complete! 🥷':'Mission failed')+'</h1><p class="mut">'+(win?C.n+' done.':why||'Try again.')+'</p><table>'+row('Distance',Math.round(dist)+(C.g=='survive'?'':' / '+C.len))+row('Coins',coins)+row('Hits taken',hits)+row('Time',Math.round(time/60)+'s')+row(win?'Payout':'Coins earned','<b>'+f(p)+'</b>')+'</table>'+(win?'<button class="go" id="nx">Next chapter ▶</button><button id="sd">Send payout to Lagos Life</button>':'<button class="go" id="rt">Try again</button>')+'<p class="mut" id="sm"></p>');
 var nx=$('nx');if(nx)nx.onclick=function(){chap++;save();intro()};var rt=$('rt');if(rt)rt.onclick=start;var sd=$('sd');if(sd)sd.onclick=function(){LL.award(p).then(function(r){$('sm').textContent=r.ok?'Sent!':r.why})}}
